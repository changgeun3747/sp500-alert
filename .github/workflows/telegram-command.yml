name: Telegram Command Poller

on:
  schedule:
    # GitHub Actions cannot receive Telegram messages instantly without a server.
    # This checks for the "1" command every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sp500_alert.py --poll-telegram
