name: S&P500 Monthly Alert

on:
  schedule:
    # Weekdays UTC 00:00 = Korea Standard Time 09:00.
    # The script decides whether today is the monthly payday alert date.
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python sp500_alert.py --force
          else
            python sp500_alert.py
          fi
